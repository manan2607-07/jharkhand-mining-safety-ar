version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jharkhand-safety-backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - JWT_SECRET=${JWT_SECRET}
      - CERT_SECRET=${CERT_SECRET}
      - NODE_ENV=${NODE_ENV:-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5176}
      - ENABLE_EVALUATION_CREDENTIALS=${ENABLE_EVALUATION_CREDENTIALS:-false}
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jharkhand-safety-frontend
    ports:
      - "5176:80"
    depends_on:
      - backend
    restart: unless-stopped
